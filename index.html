<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark light" />
    <title>Rövşən Qədirov — 50 illik yubiley</title>
    <meta
      name="description"
      content="Rövşən əmi üçün 50 illik yubileyə həsr olunmuş şəxsi rəqəmsal hədiyyə."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="az_AZ" />
    <meta property="og:title" content="Rövşən Qədirov — 50 illik yubiley" />
    <meta
      property="og:description"
      content="Əlli il. Saysız xatirələr. Bir ömürlük dəyər."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      /* Pick the theme before first paint, so the page never flashes the wrong one.
         Saved choice first, otherwise the device setting. Keep in step with src/lib/theme.ts. */
      (function () {
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('theme');
          theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#fbf9f5' : '#000000');
      })();
    </script>
    <style>
      /* Avoid a flash of the wrong colour before the stylesheet arrives. */
      html,
      body {
        background: #000;
      }
      html[data-theme='light'],
      html[data-theme='light'] body {
        background: #fbf9f5;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui, sans-serif; color: #f5f1ea">
        Bu səhifəni görmək üçün JavaScript aktiv olmalıdır.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
